<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 17 17" role="img" aria-label="Battery charging">
  <title>Battery charging animated</title>
  <defs>
    <clipPath id="batteryInterior">
      <rect x="5.989" y="1.949" width="7.011" height="13.051" rx="0.55"/>
    </clipPath>
  </defs>
  <!-- Same Frexy Glyph battery silhouette as the supplied battery-empty icon. -->
  <path fill="#14d72b" fill-rule="evenodd" d="M12.306 1H10.999V.016H8V1H6.77C5.834 1 5 1.721 5 2.646v11.679C5 15.249 5.834 16 6.77 16h5.536C13.242 16 14 15.249 14 14.325V2.646C14 1.721 13.241 1 12.306 1ZM13 14c0 .516-.484 1-1 1H7c-.515 0-1.011-.484-1.011-1V3c0-.514.496-1.051 1.011-1.051h5c.516 0 1 .536 1 1.051v11Z"/>
  <!-- Animated charge level: bottom to top, then repeats. -->
  <g clip-path="url(#batteryInterior)">
    <rect x="5.989" y="14.65" width="7.011" height="0.35" fill="#14d72b">
      <animate attributeName="y" values="14.65;11.7;8.7;5.7;1.949;1.949" keyTimes="0;0.2;0.4;0.6;0.85;1" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="height" values="0.35;3.3;6.3;9.3;13.051;13.051" keyTimes="0;0.2;0.4;0.6;0.85;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>