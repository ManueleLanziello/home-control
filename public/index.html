<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b12">
  <meta name="application-name" content="Home Control">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Home Control</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/home-control.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="dashboard-body">
  <main class="dashboard-shell">
    <header class="dashboard-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">⌂</span>
        <div>
          <h1><span>HOME</span> CONTROL</h1>
          <p>Gestione della casa intelligente</p>
        </div>
      </div>

      <section class="system-status" aria-label="Stato sistema">
        <span class="system-status-dot is-neutral" aria-hidden="true"></span>
        <div>
          <strong>Pronto per la configurazione</strong>
          <span class="status-message">Nessun dispositivo configurato</span>
        </div>
      </section>

      <a class="settings-link" href="/settings" aria-label="Apri impostazioni">Impostazioni</a>
    </header>

    <section class="floorplan-dashboard" aria-label="Planimetria appartamento">
      <div class="floorplan-stage">
        <img class="floorplan-base" src="/assets/floorplan/neon-floorplan.svg" alt="Planimetria grafica dell'appartamento">
        <div class="floorplan-label-layer" aria-hidden="true" data-floorplan-labels></div>
        <div class="floorplan-device-layer" data-floorplan-devices></div>
      </div>

      <div class="floorplan-legend" aria-label="Legenda planimetria">
        <span><i class="legend-icon legend-icon--light" aria-hidden="true"></i>Luce</span>
        <span><i class="legend-icon legend-icon--temperature" aria-hidden="true"></i>Temperatura</span>
        <span><i class="legend-line legend-line--window" aria-hidden="true"></i>Finestra</span>
        <span><i class="legend-line legend-line--door-window" aria-hidden="true"></i>Porta finestra</span>
        <span><i class="legend-line legend-line--door" aria-hidden="true"></i>Porta interna</span>
        <span><i class="legend-line legend-line--entry" aria-hidden="true"></i>Ingresso</span>
      </div>
    </section>

    <footer>
      <span>Home Control · Planimetria statica</span>
    </footer>
  </main>
  <script type="module" src="/js/dashboard.js"></script>
  <script type="module" src="/pwa.js"></script>
</body>
</html>
