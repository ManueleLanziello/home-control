  <rect class="opening-base door-window" x="3400.5" y="1943.5" width="19.0002" height="292"/>
  <rect class="opening-base door-window" x="3400.5" y="3042.5" width="19.0002" height="292"/>

  <rect class="opening-base window" x="1763.5" y="3042.5" width="18.9999" height="292"/>
  <rect class="opening-base window" x="2332.5" y="1737.5" width="154" height="19.9999"/>
  <rect class="opening-base window" x="3399.5" y="2563.5" width="20.0002" height="154"/>
</svg>
