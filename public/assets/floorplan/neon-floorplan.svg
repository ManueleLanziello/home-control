  <rect class="inner-wall" x="1785.5" y="1910.5" width="260" height="479"/>
  <rect class="inner-wall" x="1802.5" y="1930.5" width="241" height="459"/>

  <rect class="opening-base door" x="1117.5" y="1020.5" width="260" height="15.9998"/>
  <rect class="opening-base door" x="2110.5" y="1020.5" width="260" height="15.9998"/>
  <rect class="opening-base door" x="2113.5" y="1611.5" width="260" height="16.9999"/>
  <rect class="opening-base door" x="2416.5" y="1137.5" width="16.9998" height="260"/>
  <rect class="opening-base door" x="2049.5" y="1137.5" width="16.0002" height="260"/>
