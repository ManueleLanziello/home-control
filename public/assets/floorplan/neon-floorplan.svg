<svg xmlns="http://www.w3.org/2000/svg" viewBox="1763.5 1736.5 1656 1723" role="img" aria-labelledby="floorplan-title floorplan-description">
  <title id="floorplan-title">Planimetria Home Control</title>
  <desc id="floorplan-description">Base grafica statica della casa con muri e aperture in stile neon.</desc>
  <defs>
    <filter id="wallGlow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#8fe6ff" flood-opacity=".6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#1bb8ff" flood-opacity=".22"/>
    </filter>
    <filter id="cyanGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#12ddff" flood-opacity=".95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#02a8ff" flood-opacity=".55"/>
    </filter>
    <filter id="greenGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#32ff80" flood-opacity=".95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="17" flood-color="#00d85f" flood-opacity=".55"/>
    </filter>
    <filter id="violetGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#9459ff" flood-opacity=".98"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#5f22ff" flood-opacity=".58"/>
    </filter>
    <filter id="entryGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffd84d" flood-opacity=".95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#ff8a00" flood-opacity=".7"/>
    </filter>
    <radialGradient id="roomShade" cx="50%" cy="50%" r="68%">
      <stop offset="0" stop-color="#082437" stop-opacity=".5"/>
      <stop offset="1" stop-color="#020a12" stop-opacity=".18"/>
    </radialGradient>
  </defs>
  <style>
    .room-fill { fill: url(#roomShade); stroke: none; }
    .wall { fill: none; stroke: #d8f5ff; stroke-width: 9; stroke-linejoin: round; filter: url(#wallGlow); }
    .inner-wall { fill: none; stroke: #bfefff; stroke-width: 7; stroke-linejoin: round; filter: url(#wallGlow); opacity: .92; }
    .opening-base { stroke: #04131f; stroke-width: 7; stroke-linejoin: round; }
    .window { fill: #37ff83; filter: url(#greenGlow); }
    .door-window { fill: #13dfff; filter: url(#cyanGlow); }
    .door { fill: #7b37ff; filter: url(#violetGlow); }
    .entry { fill: #ffc424; filter: url(#entryGlow); }
  </style>
  <rect class="room-fill" x="1782.5" y="1757.5" width="819" height="663"/>
  <rect class="room-fill" x="2620.5" y="1757.5" width="779" height="663"/>
  <rect class="room-fill" x="1782.5" y="2433.5" width="819" height="1014"/>
  <rect class="room-fill" x="2620.5" y="2433.5" width="259" height="429"/>
  <rect class="room-fill" x="2893.5" y="2433.5" width="506" height="429"/>
  <rect class="room-fill" x="2620.5" y="2876.5" width="779" height="571"/>
  <rect class="room-fill" x="2419.5" y="3103.5" width="180" height="344"/>

  <rect class="wall" x="1763.5" y="1736.5" width="1656" height="1723"/>
  <rect class="inner-wall" x="1782.5" y="1757.5" width="819" height="663"/>
  <rect class="inner-wall" x="2620.5" y="1757.5" width="779" height="663"/>
  <rect class="inner-wall" x="1782.5" y="2433.5" width="819" height="1014"/>
  <rect class="inner-wall" x="2620.5" y="2433.5" width="259" height="429"/>
  <rect class="inner-wall" x="2893.5" y="2433.5" width="506" height="429"/>
  <rect class="inner-wall" x="2620.5" y="2876.5" width="779" height="571"/>
  <rect class="inner-wall" x="2405.5" y="3088.5" width="196" height="359"/>
  <rect class="inner-wall" x="2419.5" y="3103.5" width="180" height="344"/>

  <rect class="opening-base door" x="1905.5" y="2420.5" width="195" height="12"/>
  <rect class="opening-base door" x="2649.5" y="2420.5" width="195" height="12"/>
  <rect class="opening-base door" x="2652.5" y="2864.5" width="195" height="12"/>
  <rect class="opening-base door" x="2879.5" y="2508.5" width="13" height="194"/>
  <rect class="opening-base door" x="2604.5" y="2508.5" width="12" height="194"/>
  <rect class="opening-base door" x="2406.5" y="3152.5" width="13" height="195"/>

  <rect class="opening-base entry" x="2189.5" y="3448.5" width="195" height="12"/>

