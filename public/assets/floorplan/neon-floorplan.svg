<svg xmlns="http://www.w3.org/2000/svg" viewBox="926 105 2214 2306" role="img" aria-labelledby="floorplan-title floorplan-description">
  <title id="floorplan-title">Planimetria Home Control</title>
  <desc id="floorplan-description">Base grafica statica della casa con muri e aperture in stile neon.</desc>
  <defs>
    <filter id="wallGlow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#8fe6ff" flood-opacity=".6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#1bb8ff" flood-opacity=".22"/>
    </filter>
    <filter id="cyanGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#12ddff" flood-opacity=".95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#02a8ff" flood-opacity=".55"/>
    </filter>
    <filter id="greenGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#32ff80" flood-opacity=".95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="17" flood-color="#00d85f" flood-opacity=".55"/>
    </filter>
    <filter id="blueGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#1e8dff" flood-opacity=".95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#006dff" flood-opacity=".58"/>
    </filter>
    <filter id="entryGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffd84d" flood-opacity=".95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#ff8a00" flood-opacity=".7"/>
    </filter>
    <radialGradient id="roomShade" cx="50%" cy="50%" r="68%">
      <stop offset="0" stop-color="#082437" stop-opacity=".5"/>
      <stop offset="1" stop-color="#020a12" stop-opacity=".18"/>
    </radialGradient>
  </defs>
  <style>
    .room-fill { fill: url(#roomShade); stroke: none; }
    .wall { fill: none; stroke: #d8f5ff; stroke-width: 9; stroke-linejoin: round; filter: url(#wallGlow); }
    .inner-wall { fill: none; stroke: #bfefff; stroke-width: 7; stroke-linejoin: round; filter: url(#wallGlow); opacity: .92; }
    .opening-base { stroke: #04131f; stroke-width: 7; stroke-linejoin: round; }
    .window { fill: #37ff83; filter: url(#greenGlow); }
    .door-window { fill: #13dfff; filter: url(#cyanGlow); }
    .door { fill: #167dff; filter: url(#blueGlow); }
    .entry { fill: #ffc424; filter: url(#entryGlow); }
  </style>
  <rect class="room-fill" x="954.5" y="137.5" width="1091" height="883"/>
  <rect class="room-fill" x="2070.5" y="137.5" width="1039" height="883"/>
  <rect class="room-fill" x="954.5" y="1038.5" width="1091" height="1351"/>
